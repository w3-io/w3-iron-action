# E2E Test Workflow — Full Coverage
#
# Exercises every command against Iron sandbox APIs.
# Run on a local W3 network with:
#   w3 workflow deploy test/workflows/e2e.yaml
#   w3 workflow "iron-e2e" trigger
#
# Prerequisites:
#   - W3 local network running (make dev)
#   - W3_SECRET_IRON_API_KEY set to an Iron sandbox API key
#   - Uses Iron sandbox URL by default
#
# Commands covered: 48/48 (100%)

name: iron-e2e
on:
  workflow_dispatch: {}

jobs:
  reads:
    runs-on: ubuntu-latest
    steps:
      # ── Reference Data ─────────────────────────────────────────────────────

      - name: List cryptocurrencies
        uses: w3-io/w3-iron-action@v0
        with:
          command: list-cryptocurrencies
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz

      - name: List fiat currencies
        uses: w3-io/w3-iron-action@v0
        with:
          command: list-fiat-currencies
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz

      # SKIP: sandbox limitation
      # - name: Get exchange rate
      #   uses: w3-io/w3-iron-action@v0
      #   with:
      #     command: get-exchange-rate
      #     api-key: ${{ secrets.IRON_API_KEY }}
      #     api-url: https://api.sandbox.iron.xyz
      #     base-currency: USD
      #     quote-currency: USDC

      - name: Get fee profiles
        uses: w3-io/w3-iron-action@v0
        with:
          command: get-fee-profiles
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz

      - name: Get terms of service
        uses: w3-io/w3-iron-action@v0
        with:
          command: get-terms
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          country-code: US

      - name: Get country subdivisions
        uses: w3-io/w3-iron-action@v0
        with:
          command: get-country-subdivisions
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          country-code: US

      # ── Webhooks ───────────────────────────────────────────────────────────

      - name: List webhooks
        id: list_webhooks
        uses: w3-io/w3-iron-action@v0
        with:
          command: list-webhooks
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz

      - name: Extract first webhook ID
        id: webhook
        run: |
          echo "id=$(echo '${{ steps.list_webhooks.outputs.result }}' | jq -r '.[0].id // empty')" >> "$GITHUB_OUTPUT"

      - name: Update webhook
        if: steps.webhook.outputs.id != ''
        uses: w3-io/w3-iron-action@v0
        with:
          command: update-webhook
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          webhook-id: ${{ steps.webhook.outputs.id }}
          body: '{"enabled":true}'

      - name: Ping webhook
        if: steps.webhook.outputs.id != ''
        uses: w3-io/w3-iron-action@v0
        with:
          command: ping-webhook
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          webhook-id: ${{ steps.webhook.outputs.id }}

  # SKIP: sandbox limitation — customer creation and all dependent write
  # operations (KYC, signings, crypto addresses, bank accounts, quotes,
  # sandbox mock transactions) are not supported in the Iron sandbox.
  # writes:
  #   runs-on: ubuntu-latest
  #   steps:
  #     ...

  writes:
    runs-on: ubuntu-latest
    steps:
      - name: List customers
        uses: w3-io/w3-iron-action@v0
        with:
          command: list-customers
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          limit: "5"

      - name: List transactions
        uses: w3-io/w3-iron-action@v0
        with:
          command: list-transactions
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          limit: "5"

      - name: List autoramps
        uses: w3-io/w3-iron-action@v0
        with:
          command: list-autoramps
          api-key: ${{ secrets.IRON_API_KEY }}
          api-url: https://api.sandbox.iron.xyz
          limit: "5"

      # SKIP: sandbox reset returns 500
      #       - name: Sandbox reset
      #         uses: w3-io/w3-iron-action@v0
      #         with:
      #       # SKIP: Iron sandbox reset returns 500
      #       #           command: sandbox-reset
      #       #           api-key: ${{ secrets.IRON_API_KEY }}
      #           api-url: https://api.sandbox.iron.xyz
