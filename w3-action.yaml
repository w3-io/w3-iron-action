kind: integration
name: Iron
version: 0.1.0
repo: w3-io/w3-iron-action
partner: iron
description: Fiat-to-crypto on/off-ramp, stablecoin autoramps, and bank account management
context:
  "Iron provides regulated fiat rails for crypto operations. On-ramp converts
  bank deposits (USD, EUR, GBP via ACH, SEPA, Wire) to stablecoins (USDC, EURC, USDT).
  Off-ramp converts stablecoins back to fiat bank transfers. Autoramps are standing
  conversion rules — once created, they execute automatically when funds arrive. Supports
  Ethereum, Polygon, Arbitrum, Base, Solana, and Stellar.


  Typical workflow pattern: get-quote (lock a rate) → create-autoramp (execute the
  conversion) → list-transactions (monitor progress). Customers must be onboarded
  and KYC'd before creating autoramps — use create-customer + create-identification
  for programmatic onboarding, or Iron's hosted KYC flow for user-facing applications.


  Use with w3/mongodb for transaction state, w3/email for notifications, and w3/chainalysis
  for compliance screening. Webhook triggers (coming soon) enable event-driven flows:
  react when deposits arrive or transfers complete.


  Two environments: production (api.iron.xyz) and sandbox (api.sandbox.iron.xyz) for
  testing with mock transactions.

  "
commands:
  - name: get-quote
    description:
      "Get a locked-rate quote for a fiat-to-crypto or crypto-to-fiat conversion.
      Returns the exchange rate, fees, and amounts. Rate is locked for up to 20 minutes.
      Always call this before create-autoramp.

      "
    inputs:
      customer-id:
        type: string
        required: true
        description: Customer ID (must be KYC-verified)
      source-currency:
        type: string
        required: true
        description: Source currency code (e.g. USD, USDC, EUR, EURC)
      destination-currency:
        type: string
        required: true
        description: Destination currency code
      source-amount:
        type: string
        required: false
        description: Amount in source currency (provide this OR destination-amount)
      destination-amount:
        type: string
        required: false
        description: Amount in destination currency
    outputs:
      result:
        type: object
        description: "{effective_rate, fee, from, out_amount, ...} with locked rate"
  - name: create-autoramp
    description:
      "Create an on-ramp (fiat→crypto), off-ramp (crypto→fiat), or swap (crypto→crypto)
      autoramp. This is the core operation — it initiates a conversion that executes
      when funds are deposited. Requires a KYC'd customer with registered addresses.

      "
    inputs:
      body:
        type: object
        required: true
        description:
          "Autoramp parameters as JSON. Key fields: customer_id, source_currency,
          destination_currency, source_amount or destination_amount, destination_address_id
          (crypto wallet for on-ramp, bank account for off-ramp), deposit_rail (ach,
          sepa, wire, etc. for on-ramp). See Iron docs for full schema.

          "
    outputs:
      result:
        type: object
        description: Autoramp object with id, status, amounts, addresses, created_at
  - name: get-autoramp
    description: Get the current status and details of an autoramp by ID.
    inputs:
      autoramp-id:
        type: string
        required: true
        description: Autoramp ID
    outputs:
      result:
        type: object
        description: Full autoramp object with status, amounts, transaction history
  - name: list-autoramps
    description: List autoramps for a customer with optional status filter.
    inputs:
      customer-id:
        type: string
        required: false
        description: Filter by customer ID
      status:
        type: string
        required: false
        description: Filter by status (e.g. active, completed, cancelled)
    outputs:
      result:
        type: object
        description: "{cursor, items: [autoramp objects], prev_cursor}"
  - name: cancel-autoramp
    description: Cancel a pending or active autoramp.
    inputs:
      autoramp-id:
        type: string
        required: true
        description: Autoramp ID to cancel
    outputs:
      result:
        type: object
        description: Cancelled autoramp object
  - name: list-transactions
    description:
      "List autoramp transactions with optional filters. Transactions represent
      individual conversions within an autoramp — an autoramp can have multiple transactions
      over time.

      "
    inputs:
      customer-id:
        type: string
        required: false
        description: Filter by customer
      autoramp-id:
        type: string
        required: false
        description: Filter by autoramp
      status:
        type: string
        required: false
        description: Filter by transaction status
    outputs:
      result:
        type: object
        description: "{cursor, items: [transaction objects with amounts, status, timestamps]}"
  - name: create-customer
    description:
      "Create a new customer record. Required before any financial operations.
      Customer must complete KYC (via create-identification) before creating autoramps.

      "
    inputs:
      body:
        type: object
        required: true
        description:
          'Customer params as JSON. Required: customer_type ("Person" or
          "Business"), email. Optional: name, external_id (your system''s ID for cross-referencing).

          '
    outputs:
      result:
        type: object
        description: Customer object with id, customer_type, email, status, created_at
  - name: get-customer
    description: Get a customer by Iron's internal ID.
    inputs:
      customer-id:
        type: string
        required: true
        description: Customer ID
    outputs:
      result:
        type: object
        description: Full customer object with status, identification_ids, signing_ids
  - name: get-customer-by-external-id
    description: Get a customer by your external ID (the ID from your system).
    inputs:
      external-id:
        type: string
        required: true
        description: Your external ID
    outputs:
      result:
        type: object
        description: Customer object
  - name: list-customers
    description: List all customers with pagination.
    inputs:
      limit:
        type: number
        required: false
        description: Page size
      offset:
        type: number
        required: false
        description: Pagination offset
    outputs:
      result:
        type: object
        description: "{cursor, items: [customer objects]}"
  - name: create-identification
    description:
      "Start KYC/KYB verification for a customer. Returns a hosted verification
      URL that the customer completes in their browser. Iron handles the identity verification
      flow. Use webhooks to know when verification completes.

      "
    inputs:
      customer-id:
        type: string
        required: true
        description: Customer ID to verify
    outputs:
      result:
        type: object
        description:
          Identification object with id, status, and hosted verification
          URL
  - name: register-hosted-wallet
    description:
      "Register a hosted (exchange) wallet address for a customer. Required
      for Travel Rule compliance. Used as destination for on-ramp autoramps.

      "
    inputs:
      body:
        type: object
        required: true
        description: "Wallet params: customer_id, address, chain, vasp_id (from search-vasps)"
    outputs:
      result:
        type: object
        description: Registered wallet address with id, address, chain, status
  - name: register-selfhosted-wallet
    description:
      "Register a self-hosted (non-custodial) wallet address for a customer.
      Requires the customer to sign a message proving wallet ownership.

      "
    inputs:
      body:
        type: object
        required: true
        description: "Wallet params: customer_id, address, chain"
    outputs:
      result:
        type: object
        description: Registered wallet address with id, address, chain, status
  - name: register-bank-account
    description:
      "Register a fiat bank account for a customer. Supports SEPA, ACH, Wire,
      RTP, SWIFT, CHAPS, FPS. Bank must be verified before use (microdeposits or open
      banking).

      "
    inputs:
      body:
        type: object
        required: true
        description:
          "Bank account params: customer_id, deposit_rail, account details
          (varies by rail)"
    outputs:
      result:
        type: object
        description: Bank account with id, status, deposit_rail, verification status
  - name: list-bank-accounts
    description: List registered bank accounts for a customer.
    inputs:
      customer-id:
        type: string
        required: false
        description: Filter by customer (omit for all)
    outputs:
      result:
        type: object
        description: "{cursor, items: [bank account objects]}"
  - name: list-cryptocurrencies
    description:
      "List all supported cryptocurrencies with chain and contract addresses.
      Returns USDC, EURC, USDT on Ethereum, Polygon, Arbitrum, Base, Solana, Stellar.

      "
    inputs: {}
    outputs:
      result:
        type: array
        description: "[{code, name, chain, address, mint_only}]"
  - name: list-fiat-currencies
    description: List all supported fiat currencies (USD, EUR, GBP).
    inputs: {}
    outputs:
      result:
        type: array
        description: "[{code, name, ...}]"
  - name: get-exchange-rate
    description:
      "Get the current exchange rate between two currencies. Lighter than
      get-quote — no rate locking, no customer context. Good for display or threshold
      checks.

      "
    inputs:
      source-currency:
        type: string
        required: true
        description: Source currency code (e.g. USD)
      destination-currency:
        type: string
        required: true
        description: Destination currency code (e.g. USDC)
      source-amount:
        type: string
        required: true
        description: Amount to convert
    outputs:
      result:
        type: object
        description: "{effective_rate, fee, from, out_amount}"
  - name: list-webhooks
    description: List configured webhook endpoints.
    inputs: {}
    outputs:
      result:
        type: object
        description: "{cursor, items: [webhook configurations]}"
  - name: sandbox-mock-transaction
    description:
      "Create a mock transaction in the sandbox environment for testing.
      Simulates a deposit arriving or a transfer completing.

      "
    inputs:
      body:
        type: object
        required: true
        description: "Mock params: autoramp_id, amount, currency, initial_state"
    outputs:
      result:
        type: object
        description: Mock transaction object
  - name: update-webhook
    description: Update a webhook endpoint configuration.
    inputs:
      webhook-id:
        type: string
        required: true
        description: Webhook ID to update
      body:
        type: object
        required: true
        description: Updated webhook configuration as JSON
    outputs:
      result:
        type: object
        description: Updated webhook configuration
  - name: ping-webhook
    description: Send a test ping to a webhook endpoint.
    inputs:
      webhook-id:
        type: string
        required: true
        description: Webhook ID to ping
    outputs:
      result:
        type: object
        description: Ping response with delivery status
  - name: sandbox-update-autoramp
    description: Update an autoramp status in sandbox for testing.
    inputs:
      autoramp-id:
        type: string
        required: true
        description: Autoramp ID to update
      sandbox-status:
        type: string
        required: false
        description: New status (or provide via body)
    outputs:
      result:
        type: object
        description: Updated autoramp object with new status
  - name: sandbox-update-fiat-verification
    description: Update a fiat address verification status in sandbox.
    inputs:
      address-id:
        type: string
        required: true
        description: Fiat address ID to update
      sandbox-status:
        type: string
        required: false
        description: New status (or provide via body)
    outputs:
      result:
        type: object
        description: Updated fiat address with new verification status
  - name: sandbox-update-identification
    description: Update an identification status in sandbox for testing.
    inputs:
      address-id:
        type: string
        required: true
        description: Identification ID to update
      sandbox-status:
        type: string
        required: false
        description: New status (or provide via body)
    outputs:
      result:
        type: object
        description: Updated identification with new status
  - name: sandbox-update-transaction
    description: Update a transaction state in sandbox for testing.
    inputs:
      address-id:
        type: string
        required: true
        description: Transaction ID to update
      sandbox-status:
        type: string
        required: false
        description: New state (or provide via body)
    outputs:
      result:
        type: object
        description: Updated transaction with new state
